<!DOCTYPE html><html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<style>body{margin:0;background:#f3ead8;font:12px sans-serif}#g{display:flex;flex-wrap:wrap}.c{width:240px;text-align:center}.c img{width:240px;height:240px}</style></head>
<body><div id="g"></div><script type="module">
import * as THREE from 'three';
import { cargarModelos, construirPiezas, tieneModelo, modeloSuelto } from '../js/modelos.js';
import { CATALOGO, MATERIALES } from '../js/catalogo.js';
await cargarModelos('../assets/modelos.glb?' + Date.now());
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(480, 480); r.toneMapping = THREE.NeutralToneMapping; r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true;
const params = new URLSearchParams(location.search);
const viejo = params.has('viejo');
const filtro = params.get('ids');
const escena = new THREE.Scene(); escena.background = new THREE.Color(0xf3ead8);
escena.add(new THREE.HemisphereLight(0xfff4e6, 0x8a7a6a, 1.5));
const sol = new THREE.DirectionalLight(0xffffff, 1.7); sol.position.set(4, 8, 5); sol.castShadow = true; sol.shadow.bias = -0.0005; sol.shadow.normalBias = 0.02; escena.add(sol);
const suelo = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0xe8dcc6 })); suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; escena.add(suelo);
const SUELTOS = ['sucio-polvo', 'sucio-barro', 'sucio-caca', 'sucio-hormiga', 'sucio-arana', 'sucio-cucaracha', 'robot-suelo'].map(id => ({ id, suelto: true, piezas: [] }));
for (const d of [...CATALOGO, ...MATERIALES, ...SUELTOS]) {
  if (!d.piezas) continue;
  if (d.suelto && viejo) continue;
  if (filtro && !filtro.split(',').includes(d.id)) continue;
  if (!filtro && !viejo && !tieneModelo(d.id)) continue;
  const grupo = d.suelto ? modeloSuelto(d.id) : construirPiezas(d.piezas, { id: viejo ? null : d.id }).grupo;
  if (!grupo) continue;
  const caja = new THREE.Box3().setFromObject(grupo); const tam = caja.getSize(new THREE.Vector3()); const cen = caja.getCenter(new THREE.Vector3());
  const m = Math.max(tam.x, tam.y, tam.z) * 0.62;
  const cam = new THREE.OrthographicCamera(-m, m, m, -m, 0.01, 50);
  cam.position.set(cen.x + 3, cen.y + 2.2, cen.z + 3); cam.lookAt(cen);
  sol.shadow.camera.left = -3; sol.shadow.camera.right = 3; sol.shadow.camera.top = 3; sol.shadow.camera.bottom = -3;
  escena.add(grupo); r.render(escena, cam); escena.remove(grupo);
  const div = document.createElement('div'); div.className = 'c';
  div.innerHTML = `<img src="${r.domElement.toDataURL()}"><br>${d.id}`; document.getElementById('g').appendChild(div);
}
document.title = 'listo';
</script></body></html>
