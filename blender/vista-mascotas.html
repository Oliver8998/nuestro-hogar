<!DOCTYPE html><html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<style>body{margin:0;background:#f3e6d6}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { ESPECIES, crearModeloMascota } from '../js/mascotas.js';
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || Object.keys(ESPECIES).join(',')).split(',');
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight);
r.shadowMap.enabled = true;
r.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(r.domElement);
const esc = new THREE.Scene();
esc.background = new THREE.Color(0xf3e6d6);
esc.add(new THREE.HemisphereLight(0xfff4e6, 0x8a7560, 1.6));
const sol = new THREE.DirectionalLight(0xfff0dd, 1.6);
sol.position.set(4, 8, 6);
sol.castShadow = true;
Object.assign(sol.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
esc.add(sol);
const suelo = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0xe8d6bf }));
suelo.rotation.x = -Math.PI / 2;
suelo.receiveShadow = true;
esc.add(suelo);
const cols = Math.ceil(Math.sqrt(ids.length * 1.3));
const lado = Number(q.get('lado') || 0.95);
ids.forEach((id, k) => {
  const p = crearModeloMascota(id);
  p.raiz.position.set((k % cols - (cols - 1) / 2) * lado, 0, (Math.floor(k / cols) - (Math.ceil(ids.length / cols) - 1) / 2) * lado);
  p.raiz.rotation.y = Number(q.get('rot') || 0.45);
  esc.add(p.raiz);
});
const a = Number(q.get('zoom') || 2.6);
const cam = new THREE.OrthographicCamera(-a * innerWidth / innerHeight, a * innerWidth / innerHeight, a, -a, 0.1, 50);
cam.position.set(0, 4, 8);
cam.lookAt(0, 0.35, 0);
r.render(esc, cam);
window.listo = true;
</script></body></html>
